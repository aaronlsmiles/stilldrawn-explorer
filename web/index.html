<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#e2e2de" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1915" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Every clip of the StillDrawn benchmark beside its source, with per-frame drift, a motion-vs-drift scatter and a leaderboard you can re-weight." />
    <title>StillDrawn Explorer</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- the data every view waits for (src/data/load.ts), fetched alongside the app's script -->
    <link rel="preload" href="/data/v1/index.json" as="fetch" crossorigin />
    <link rel="preload" href="/data/v1/engines.json" as="fetch" crossorigin />
    <link rel="preload" href="/data/v1/panels.json" as="fetch" crossorigin />
    <link rel="preload" href="/data/v1/clips.json" as="fetch" crossorigin />
    <link rel="preload" href="/data/v1/paper.json" as="fetch" crossorigin />
    <link rel="preload" href="/data/v1/taxonomy.json" as="fetch" crossorigin />
    <link rel="preload" href="/data/v1/basis.json" as="fetch" crossorigin />
    <script>
      try { const t = localStorage.getItem("sd-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>StillDrawn Explorer needs JavaScript to play clips and draw curves. The dataset itself is at doi.org/10.5281/zenodo.23072784.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
