<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#e2e2de" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1915" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Every clip of the StillDrawn benchmark beside its source, with per-frame drift, a motion-vs-drift scatter and a leaderboard you can re-weight." />
    <title>StillDrawn Explorer</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&display=swap" rel="stylesheet" />
    <script>
      try { const t = localStorage.getItem("sd-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>StillDrawn Explorer needs JavaScript to play clips and draw curves. The dataset itself is at doi.org/10.5281/zenodo.23072784.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
