[project]
name = "stilldrawn-web"
version = "0.1.0"
description = "Builds StillDrawn Explorer's data contract from the public StillDrawn release"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "pyyaml>=6.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stilldrawn_web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
