<!doctype html>
<!-- Replays film/build/setup-transcript.json for the P10 film: the film spec calls play(transcript), which types
     the command, then prints each recorded chunk at its recorded time (real pace) and resolves at the end. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @font-face { font-family: "Schibsted Grotesk"; src: url("../../web/public/fonts/schibsted-grotesk-latin.woff2") format("woff2"); font-weight: 400 900; }
  :root { --ground: #e2e2de; --ink: #1c1915; --paper: #ecebe6; --dim: #9c9488; --gold: #d6a43c; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--ground); }
  body { display: grid; place-items: center; padding: 24px; font-family: "Schibsted Grotesk", system-ui, sans-serif; }
  .win { width: min(1240px, 100%); height: min(700px, 100%); background: var(--ink); color: var(--paper); display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
  .bar { padding: 10px 16px; font-size: 14px; color: var(--dim); border-bottom: 1px solid #37332d; display: flex; justify-content: space-between; gap: 12px; }
  pre { margin: 0; padding: 18px 20px; overflow: hidden; font: 17px/1.45 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .ok { color: var(--gold); }
  .cursor { display: inline-block; width: .6em; height: 1.1em; background: var(--paper); vertical-align: -.2em; }
  @media (max-width: 480px) {
    body { padding: 12px; }
    .win { height: 100%; }
    .bar { font-size: 12px; flex-direction: column; gap: 2px; }
    pre { font-size: 11.5px; padding: 12px; }
  }
</style>
<body>
<div class="win"><div class="bar"><span id="where"></span><span id="what"></span></div><pre id="out"></pre></div>
<script>
  const out = document.getElementById("out");
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let text = "";
  const draw = () => {
    out.innerHTML = esc(text).replace(/(✓[^\n]*)/g, '<span class="ok">$1</span>') + '<span class="cursor"></span>';
    out.scrollTop = out.scrollHeight;
  };
  window.play = async (t, { cps = 14, lead = 600, scale = 1 } = {}) => {
    const wait = (ms) => new Promise((r) => setTimeout(r, ms * scale)); // scale: the capture's time dilation
    document.getElementById("where").textContent = `${t.cwd} · a fresh clone at ${t.commit}`;
    document.getElementById("what").textContent = `Node ${t.node.replace(/^v/, "")}`;
    const prompt = `${t.cwd} $ `;
    text = prompt; draw();
    await wait(lead);
    for (const ch of t.command) { text += ch; draw(); await wait(1000 / cps); }
    await wait(350);
    text += "\n"; draw();
    const start = performance.now();
    for (const c of t.chunks) {
      const due = (start + c.t * 1000 * scale - performance.now()) / scale;
      if (due > 0) await wait(due);
      text += c.text; draw();
    }
  };
  draw();
  document.fonts.ready.then(() => document.body.setAttribute("data-ready", "1"));
</script>
</body>
</html>
