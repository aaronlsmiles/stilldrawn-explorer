<!doctype html>
<!-- One film overlay, described by URL-hash JSON (render-overlays.mjs). Kinds:
     band {chip?, badge?, caption?}: credit line and caption at the foot (transparent elsewhere)
     card {eyebrow?, title, sub?} and end {title, url, lines[]}: full frame, opaque -->
<html lang="en">
<meta charset="utf-8">
<style>
  @font-face { font-family: "Schibsted Grotesk"; src: url("../../web/public/fonts/schibsted-grotesk-latin.woff2") format("woff2"); font-weight: 400 900; font-display: block; }
  :root { --ground: #e2e2de; --surface: #ecebe7; --border: #cfcec7; --text: #1c1915; --muted: #574e44; --faint: #6b6359; --gold: #c4922a; --gold-line: #9a6a12; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; font-family: "Schibsted Grotesk", system-ui, sans-serif; color: var(--text); font-kerning: normal; }
  body { position: relative; overflow: hidden; }
  .band { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; }
  .box { background: var(--surface); border: 1px solid var(--border); display: grid; gap: 10px; }
  .meta { display: flex; gap: 14px; align-items: center; color: var(--muted); }
  .badge { background: var(--gold); color: var(--text); font-weight: 600; padding: 2px 10px; }
  .caption { text-wrap: pretty; }
  /* 16:9: a box over the app's foot */
  .w .band { bottom: 44px; }
  .w .box { max-width: 1480px; padding: 18px 28px 20px; }
  .w .meta { font-size: 24px; }
  .w .caption { font-size: 34px; line-height: 1.28; }
  .w.top-right .band { bottom: auto; top: 84px; justify-content: flex-end; padding-right: 40px; }
  .w.top-right .box { max-width: 800px; }
  /* 9:16: the band below the app's frame (1559 px), full width */
  .t .band { top: 1559px; }
  .t .box { width: 100%; height: 100%; border-width: 1px 0 0; padding: 30px 48px; align-content: start; }
  .t .meta { font-size: 28px; }
  .t .caption { font-size: 44px; line-height: 1.25; }
  /* cards */
  .card { position: absolute; inset: 0; background: var(--ground); display: grid; align-content: center; }
  .w .card { padding: 0 200px; gap: 28px; }
  .t .card { padding: 0 90px; gap: 36px; }
  .eyebrow { color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  .title { font-weight: 800; letter-spacing: -.015em; text-wrap: balance; }
  .sub { color: var(--muted); text-wrap: pretty; }
  .w .eyebrow { font-size: 30px; } .w .title { font-size: 76px; line-height: 1.08; max-width: 1400px; } .w .sub { font-size: 34px; line-height: 1.35; max-width: 1300px; }
  .t .eyebrow { font-size: 40px; } .t .title { font-size: 92px; line-height: 1.06; } .t .sub { font-size: 44px; line-height: 1.32; }
  .rule { height: 6px; background: var(--gold); }
  .w .rule { width: 120px; } .t .rule { width: 160px; }
  .url { font-weight: 600; }
  .w .url { font-size: 44px; } .t .url { font-size: 52px; }
  .credits { color: var(--muted); display: grid; gap: 6px; }
  .w .credits { font-size: 24px; margin-top: 24px; } .t .credits { font-size: 32px; margin-top: 40px; }
</style>
<body>
<script>
  const o = JSON.parse(decodeURIComponent(location.hash.slice(1)));
  const [W, H] = o.aspect === "9x16" ? [1080, 1920] : [1920, 1080];
  document.body.className = (o.aspect === "9x16" ? "t" : "w") + (o.pos ? " " + o.pos : "");
  document.body.style.width = W + "px"; document.body.style.height = H + "px";
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  if (o.kind === "band") {
    const band = el("div", "band"), box = el("div", "box");
    if (o.chip || o.badge) {
      const meta = el("div", "meta");
      if (o.badge) meta.append(el("span", "badge", o.badge));
      if (o.chip) meta.append(el("span", "", o.chip));
      box.append(meta);
    }
    if (o.caption) box.append(el("p", "caption", o.caption));
    band.append(box); document.body.append(band);
  } else {
    document.body.style.background = "var(--ground)";
    const card = el("div", "card");
    if (o.eyebrow) card.append(el("p", "eyebrow", o.eyebrow));
    card.append(el("h1", "title", o.title));
    card.append(el("div", "rule"));
    if (o.sub) card.append(el("p", "sub", o.sub));
    if (o.url) card.append(el("p", "url", o.url));
    if (o.lines) { const c = el("div", "credits"); for (const l of o.lines) c.append(el("p", "", l)); card.append(c); }
    document.body.append(card);
  }
  document.fonts.ready.then(() => document.body.setAttribute("data-ready", "1"));
</script>
</body>
</html>
